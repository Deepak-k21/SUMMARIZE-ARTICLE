[project]
name = "article-summarizer"
version = "1.0.0"
description = "Summarize articles (pasted text or a URL) with Claude, with an offline extractive fallback."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
